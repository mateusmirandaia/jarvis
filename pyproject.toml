[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-sem-hype"
version = "0.8.0"
description = "Jarvis: assistente de voz em português com Gemini Live e uma lista fechada de ações seguras no Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mateus Miranda" }]
keywords = ["jarvis", "gemini", "assistente de voz", "ia"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "google-genai>=3.6,<4",
    "python-dotenv>=1,<2",
    "pyaudio>=0.2.14",
    "send2trash>=1.8,<3",
    "httpx>=0.27,<1",
    "pywebview>=5,<7; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/mateusmirandaia/jarvis"
Issues = "https://github.com/mateusmirandaia/jarvis/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["ui/orb.html", "ui/jarvis.ico", "ui/visuais/*.js", "ui/amostras/*.wav", "ui/amostras/LEIA.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
